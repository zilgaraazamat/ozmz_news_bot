<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Турниры — OZMZ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;background:#0B0D10;color:#F5F6F7;min-height:100%;padding:24px 16px calc(40px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{width:100%;max-width:440px;margin:0 auto}
.hidden{display:none!important}

.head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back-btn{width:34px;height:34px;flex-shrink:0;border-radius:11px;background:#181A1F;border:1px solid rgba(255,255,255,.07);color:#F5F6F7;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.head h1{font-size:21px;font-weight:800;letter-spacing:-.3px}

/* ── Вкладки ── */
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tab{flex:1;padding:10px;border-radius:11px;background:#181A1F;border:1px solid rgba(255,255,255,.06);color:#9BA1AC;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:background .15s,color .15s}
.tab.active{background:#FF3D8A;border-color:#FF3D8A;color:#fff}

/* ── Карточка турнира ── */
.t-card{position:relative;background:#181A1F;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:14px;margin-bottom:11px;cursor:pointer;overflow:hidden;transition:transform .12s;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.t-card:active{transform:scale(.985)}
.t-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#FF3D8A,#FF8FC4,transparent)}
.t-card.done::before{background:linear-gradient(90deg,#E5A93C,#FFCE73,transparent)}
.tc-top{display:flex;align-items:flex-start;gap:11px}
.tc-icon{width:44px;height:44px;flex-shrink:0;border-radius:13px;background:rgba(255,61,141,.16);display:flex;align-items:center;justify-content:center;font-size:21px}
.t-card.done .tc-icon{background:rgba(229,169,60,.16)}
.tc-body{flex:1;min-width:0}
.tc-name{font-size:15.5px;font-weight:800;letter-spacing:-.2px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tc-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px}
.tc-pill{font-size:11px;font-weight:700;color:#9BA1AC;background:rgba(255,255,255,.06);padding:3.5px 8px;border-radius:7px;white-space:nowrap}
.tc-status{flex-shrink:0;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:4px 8px;border-radius:6px}
.st-live{background:rgba(48,209,88,.16);color:#4ADE80}
.st-done{background:rgba(229,169,60,.16);color:#FFCE73}

/* ── Чемпион ── */
.champ-row{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 12px;border-radius:12px;background:linear-gradient(135deg,rgba(229,169,60,.14),rgba(229,169,60,.05));border:1px solid rgba(229,169,60,.22)}
.champ-cup{font-size:22px;flex-shrink:0}
.champ-body{flex:1;min-width:0}
.champ-label{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:#C79A3C}
.champ-name{font-size:14.5px;font-weight:800;color:#FFCE73;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.champ-score{flex-shrink:0;text-align:right}
.champ-score-val{font-size:14px;font-weight:800;color:#FFCE73;font-variant-numeric:tabular-nums}
.champ-runner{font-size:10.5px;color:#8A8F98;margin-top:2px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.progress-line{display:flex;align-items:center;gap:8px;margin-top:11px}
.pl-bar{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.pl-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#FF3D8A,#FF8FC4)}
.pl-text{font-size:10.5px;color:#7C818B;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

.empty{text-align:center;padding:44px 16px}
.empty-icon{font-size:34px;opacity:.32;margin-bottom:9px}
.empty-title{font-size:14px;font-weight:700;color:#9BA1AC}
.empty-sub{font-size:12px;color:#5C616B;margin-top:4px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <button class="back-btn" onclick="goBack()">‹</button>
    <h1>🏆 Турниры</h1>
  </div>

  <div class="tabs">
    <button class="tab active" id="tab-active" onclick="switchTab('active')">Текущие</button>
    <button class="tab" id="tab-history" onclick="switchTab('history')">История</button>
  </div>

  <div id="list"><div class="empty">Загрузка…</div></div>
</div>

<script>
const userId = new URLSearchParams(location.search).get("uid");
let ALL = [];
let tab = "active";

if (window.Telegram && Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  if (typeof Telegram.WebApp.disableVerticalSwipes === "function") Telegram.WebApp.disableVerticalSwipes();
}

function haptic(k) {
  const h = window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback;
  if (h) try { h.impactOccurred(k || "light"); } catch (e) {}
}

function goBack() {
  location.href = "/app" + (userId ? ("?uid=" + userId) : "");
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function fmtDate(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  const months = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
  if (!y || !m || !d) return iso;
  return `${parseInt(d, 10)} ${months[parseInt(m, 10) - 1] || ""}`;
}

function dateRange(a, b) {
  if (a && b && a !== b) return `${fmtDate(a)} — ${fmtDate(b)}`;
  return fmtDate(a || b);
}

function openTournament(id) {
  haptic("medium");
  location.href = `/tournament?id=${id}${userId ? `&uid=${userId}` : ""}`;
}

function switchTab(t) {
  tab = t;
  haptic("light");
  document.getElementById("tab-active").classList.toggle("active", t === "active");
  document.getElementById("tab-history").classList.toggle("active", t === "history");
  render();
}

async function load() {
  try {
    const r = await fetch("/api/tournaments").then(r => r.json());
    ALL = r.tournaments || [];
    render();
  } catch (e) {
    document.getElementById("list").innerHTML =
      `<div class="empty"><div class="empty-icon">⚠️</div><div class="empty-title">Ошибка загрузки</div></div>`;
  }
}

function render() {
  const items = ALL.filter(t => tab === "history" ? t.is_finished : !t.is_finished);
  const el = document.getElementById("list");

  if (!items.length) {
    el.innerHTML = tab === "history"
      ? `<div class="empty"><div class="empty-icon">📜</div>
           <div class="empty-title">История пока пуста</div>
           <div class="empty-sub">Здесь появятся завершённые турниры и их чемпионы</div></div>`
      : `<div class="empty"><div class="empty-icon">🏆</div>
           <div class="empty-title">Активных турниров нет</div>
           <div class="empty-sub">Следи за новостями — скоро объявим следующий</div></div>`;
    return;
  }
  el.innerHTML = items.map(cardHtml).join("");
}

function cardHtml(t) {
  const when = dateRange(t.start_date, t.end_date);
  const done = t.is_finished;
  const champ = t.champion;

  // Прогресс матчей — только у идущих турниров: показывает, сколько сыграно.
  const progress = (!done && t.matches_total)
    ? `<div class="progress-line">
         <div class="pl-bar"><div class="pl-fill" style="width:${Math.round(t.matches_played / t.matches_total * 100)}%"></div></div>
         <span class="pl-text">${t.matches_played}/${t.matches_total} матчей</span>
       </div>`
    : "";

  const champBlock = champ
    ? `<div class="champ-row">
         <span class="champ-cup">🏆</span>
         <div class="champ-body">
           <div class="champ-label">Чемпион</div>
           <div class="champ-name">${esc(champ.name || "—")}</div>
         </div>
         <div class="champ-score">
           <div class="champ-score-val">${esc(champ.score || "")}</div>
           ${champ.runner_up_name ? `<div class="champ-runner">финал с ${esc(champ.runner_up_name)}</div>` : ""}
         </div>
       </div>`
    : "";

  return `
    <div class="t-card ${done ? "done" : ""}" onclick="openTournament(${t.id})">
      <div class="tc-top">
        <div class="tc-icon">${done ? "🏅" : "⚽"}</div>
        <div class="tc-body">
          <div class="tc-name">${esc(t.name)}</div>
          <div class="tc-meta">
            ${when ? `<span class="tc-pill">📅 ${when}</span>` : ""}
            <span class="tc-pill">👥 ${t.teams_count} команд</span>
            ${t.location ? `<span class="tc-pill">📍 ${esc(t.location)}</span>` : ""}
          </div>
        </div>
        <span class="tc-status ${done ? "st-done" : "st-live"}">${done ? "завершён" : "идёт"}</span>
      </div>
      ${champBlock}
      ${progress}
    </div>`;
}

load();
</script>
</body>
</html>

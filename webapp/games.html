<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Игры — OZMZ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;background:#0B0D10;color:#F5F6F7;min-height:100%;padding:24px 16px calc(96px + env(safe-area-inset-bottom));-webkit-hyphens:none;hyphens:none;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wrap{width:100%;max-width:440px;margin:0 auto}
.head{text-align:center;margin-bottom:20px}
.head h1{font-size:20px;font-weight:800;letter-spacing:-.2px}
.head p{font-size:13px;color:#6B7280;margin-top:4px}
.hidden{display:none!important}
.empty{text-align:center;color:#6B7280;font-size:14px;padding:40px 10px}
.game-card{background:#181A1F;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 26px rgba(0,0,0,.35);opacity:0;transform:translateY(8px);animation:gc-in .32s cubic-bezier(.2,.8,.2,1) forwards;position:relative;overflow:hidden}
.game-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,#FF3D8A,#FF8FC4,transparent)}
@keyframes gc-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── скелетон загрузки: до первого ответа /api/games список не пустой и не
   мигает спиннером — сразу видно форму карточек игр, которые вот-вот
   появятся. Заменяется реальным контентом в renderGames() автоматически,
   как только приходят данные — отдельный JS для этого не нужен. ── */
.skel-card{background:#181A1F;border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:14px;margin-bottom:12px}
.skel-line{height:13px;border-radius:7px;margin-bottom:10px;background:linear-gradient(90deg,#1D2027 25%,#262A32 37%,#1D2027 63%);background-size:400% 100%;animation:skel-shimmer 1.4s ease-in-out infinite}
.skel-line:last-child{margin-bottom:0}
.skel-line.w70{width:70%}
.skel-line.w40{width:40%}
.skel-line.w100{width:100%;height:8px;border-radius:4px;margin-top:16px}
@keyframes skel-shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ── информационная иерархия карточки, сверху вниз: заголовок → фото поля
   (если есть) → поле/адрес → дата+день недели → время → цена → прогресс
   записи → кнопка действия → участники. Ощущение бронирования события,
   а не заполнения формы — фото, когда оно есть, идёт баннером сразу под
   заголовком, а не мелкой иконкой сбоку. ── */
.gc-title{font-size:13px;font-weight:700;color:#FF8FC4;letter-spacing:.2px;margin-bottom:6px}
.gc-photo-banner{width:100%;height:112px;border-radius:14px;overflow:hidden;margin-bottom:10px;background:#20232B}
.gc-photo-banner img{width:100%;height:100%;object-fit:cover;display:block}
.gc-field-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.gc-field{flex:1;min-width:0;font-size:14px;font-weight:700;color:#C7CAD1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gc-field-addr{color:#6B7280;font-weight:500}
.gc-datetime-row{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.gc-date-chip,.gc-time-chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px;font-variant-numeric:tabular-nums;white-space:nowrap}
.gc-date-chip{background:rgba(255,61,141,.14);color:#FF8FC4}
.gc-time-chip{background:rgba(255,255,255,.06);color:#C7CAD1}

/* ── строка ключевых цифр: цена / записано / свободно — сканируется за долю секунды ── */
.gc-price-chip{display:inline-flex;align-items:center;gap:5px;background:#101116;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-size:13px;font-weight:800;color:#F5F6F7}

/* ── визуальный индикатор заполненности: сегментированная полоса + счёт +
   сообщение о свободных местах. При ≤5 местах — подсвечиваем тревожным
   цветом, чтобы создать ощущение срочности ── */
.gc-capacity{margin-bottom:10px}
.gc-capacity-bar{display:flex;gap:3px;margin-bottom:7px}
.gc-capacity-seg{flex:1;height:8px;border-radius:3px;background:rgba(255,255,255,.07)}
.gc-capacity-seg.filled{background:linear-gradient(90deg,#FF3D8A,#FF8FC4)}
.gc-capacity-seg.filled.urgent{background:linear-gradient(90deg,#E5533D,#FF7A5C)}
.gc-capacity-meta{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gc-capacity-count{font-size:12.5px;font-weight:700;color:#C7CAD1;font-variant-numeric:tabular-nums;white-space:nowrap}
.gc-capacity-spots{font-size:12px;font-weight:700;color:#6B7280;white-space:nowrap}
.gc-capacity-spots.urgent{color:#FF7A5C}
.gc-capacity-spots.full{color:#565A61}
.roster{background:#1D2027;border-radius:12px;padding:12px 10px 10px;margin-bottom:8px}
.roster-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.roster-title{font-size:11.5px;font-weight:800;color:#C9CDD4;letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.roster-count{min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:rgba(255,61,141,.16);color:#FF8FC4;display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;font-variant-numeric:tabular-nums}
.roster-legend{display:flex;align-items:center;gap:10px}
.rl-item{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;color:#6B7280;font-weight:600;white-space:nowrap}
.rl-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.rl-dot.confirmed{background:#30D158}
.rl-dot.pending{background:#E5A93C}
.roster-empty{font-size:12px;color:#565A61}
.roster-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.player-card{background:#23262D;border-radius:12px;padding:10px 6px 9px;text-align:center;cursor:pointer;transition:transform .12s,background .12s}
.player-card:active{transform:scale(.95);background:#282B33}
.player-card-avatar-wrap{position:relative;width:34px;margin:0 auto 6px}
.player-card-avatar{width:34px;height:34px;border-radius:50%;background:rgba(255,61,141,.16);color:#FF8FC4;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;border:2px solid transparent}
.player-card-avatar.confirmed{border-color:#30D158}
.player-card-avatar.pending{border-color:#E5A93C}
.player-card-dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid #23262D}
.player-card-dot.confirmed{background:#30D158}
.player-card-dot.pending{background:#E5A93C}
.player-card-name{font-size:11.5px;font-weight:700;color:#F5F6F7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.player-card-guests{color:#FF8FC4;font-weight:700;margin-left:3px}
.player-card-ovr{font-size:10px;color:#FF8FC4;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.player-card-ovr-empty{color:#4A4E56}
.player-card-stats{display:flex;align-items:center;justify-content:center;gap:7px;font-size:9.5px;color:#6B7280;margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.roster-more-btn{width:100%;margin-top:8px;padding:9px;border-radius:10px;border:1px dashed rgba(255,255,255,.12);background:transparent;color:#FF8FC4;font-size:12px;font-weight:700;cursor:pointer;text-align:center}
.roster-more-btn:active{background:rgba(255,61,141,.08)}
/* ── Bottom Sheet записи на игру: две карточки выбора (сам / компания) в
   стиле нативных Telegram-шитов — затемнение, скруглённая панель снизу,
   ручка-грип, iOS-кривая анимации, свайп-вниз для закрытия ── */
.sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .28s ease;z-index:60}
.sheet-backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#181A1F;border-radius:20px 20px 0 0;border-top:1px solid rgba(255,255,255,.08);box-shadow:0 -12px 40px rgba(0,0,0,.5);padding:8px 16px calc(16px + env(safe-area-inset-bottom));max-width:440px;margin:0 auto;transform:translateY(100%);transition:transform .34s cubic-bezier(.32,.72,0,1);touch-action:none}
.sheet.open{transform:translateY(0)}
.sheet.dragging{transition:none}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.18);margin:4px auto 14px}
.sheet-title{font-size:16px;font-weight:800;text-align:center;margin-bottom:14px;letter-spacing:-.2px}
.sheet-card{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:#23262D;border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:14px;margin-bottom:10px;cursor:pointer;color:#F5F6F7;transition:transform .12s,background .12s;font-family:inherit}
.sheet-card:active{transform:scale(.97);background:#282B33}
.sheet-card-icon{width:44px;height:44px;flex-shrink:0;border-radius:12px;background:rgba(255,61,141,.16);display:flex;align-items:center;justify-content:center;font-size:22px}
.sheet-card-body{flex:1;min-width:0}
.sheet-card-title{font-size:14.5px;font-weight:700;margin-bottom:2px}
.sheet-card-sub{font-size:12px;color:#6B7280;line-height:1.35}
.sheet-card-chevron{color:#565A61;font-size:20px;font-weight:600;flex-shrink:0}
.sheet-back{display:inline-flex;align-items:center;gap:4px;background:none;border:none;color:#FF8FC4;font-size:13px;font-weight:700;cursor:pointer;padding:4px 0;margin-bottom:8px;font-family:inherit}
.sheet-stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:10px 0 16px}
.sheet-step-btn{width:48px;height:48px;border-radius:50%;border:1.5px solid rgba(255,61,141,.4);background:rgba(255,61,141,.1);color:#FF8FC4;font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s,background .12s;font-family:inherit}
.sheet-step-btn:active{transform:scale(.92);background:rgba(255,61,141,.22)}
.sheet-step-btn[disabled]{opacity:.35;pointer-events:none}
.sheet-step-value{min-width:64px;text-align:center;font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
.sheet-price-rows{background:#101116;border:1px solid rgba(255,255,255,.05);border-radius:14px;padding:4px 14px;margin-bottom:14px}
.sheet-price-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0}
.sheet-price-row-total{border-top:1px solid rgba(255,255,255,.07)}
.sheet-price-label{font-size:13px;color:#9BA1AC;font-weight:600}
.sheet-price-value{font-size:14px;font-weight:700;color:#F5F6F7;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet-price-total{font-size:18px;font-weight:800;color:#FF8FC4}
/* Пульс суммы при изменении количества игроков — класс вешается заново на
   каждый пересчёт (см. sheetRenderCompany), поэтому анимация перезапускается */
@keyframes price-pop{0%{transform:scale(1)}35%{transform:scale(1.16);color:#FF8FC4}100%{transform:scale(1)}}
.price-pop{animation:price-pop .28s cubic-bezier(.2,.8,.2,1)}
.sheet-footer{position:sticky;bottom:0;background:#181A1F;padding-top:10px;margin:0 -16px -1px;padding-left:16px;padding-right:16px}
#sheet-confirm-btn{font-variant-numeric:tabular-nums}
/* ── Экран подтверждения регистрации компании ── */
.sheet-confirmed-icon{width:60px;height:60px;margin:6px auto 14px;border-radius:50%;background:rgba(48,209,88,.14);display:flex;align-items:center;justify-content:center;font-size:30px;animation:conf-pop .4s cubic-bezier(.2,.9,.3,1.4)}
@keyframes conf-pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.sheet-confirmed-title{font-size:18px;font-weight:800;text-align:center;letter-spacing:-.3px;margin-bottom:18px}
.sheet-confirmed-stats{display:flex;align-items:stretch;background:#101116;border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:16px 8px;margin-bottom:18px}
.sheet-confirmed-stat{flex:1;text-align:center;min-width:0}
.sheet-confirmed-divider{width:1px;background:rgba(255,255,255,.08);margin:2px 0}
.sheet-confirmed-num{font-size:34px;font-weight:800;color:#30D158;font-variant-numeric:tabular-nums;line-height:1.1}
.sheet-confirmed-num-waiting{color:#E5A93C}
.sheet-confirmed-label{font-size:12px;color:#9BA1AC;font-weight:600;margin-top:4px}
.sheet-invite-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;max-height:34vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-invite-row{display:flex;align-items:center;gap:10px;background:#23262D;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:11px 12px}
.sheet-invite-name{flex:1;min-width:0;font-size:14px;font-weight:700;color:#F5F6F7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-invite-name.claimed{color:#30D158}
.sheet-invite-copy{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;border:1.5px solid rgba(255,61,141,.4);background:rgba(255,61,141,.1);color:#FF8FC4;border-radius:10px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .12s,background .12s}
.sheet-invite-copy:active{transform:scale(.94);background:rgba(255,61,141,.22)}
.sheet-invite-copy.copied{color:#30D158;border-color:rgba(48,209,88,.5);background:rgba(48,209,88,.12)}
.sheet-invite-copy.done{color:#30D158;border-color:transparent;background:transparent;pointer-events:none}
.btn{width:100%;padding:14px;border:none;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#FF3D8A,#D6217E);color:#fff;transition:transform .15s,background .15s;box-shadow:0 6px 18px rgba(255,61,141,.4)}
.btn:active{transform:scale(.97);background:#D6217E}
.btn[disabled]{opacity:.5;pointer-events:none}
.status-badge{width:100%;text-align:center;padding:12px;border-radius:12px;font-size:13px;font-weight:700}
.status-pending{background:rgba(229,169,60,.12);color:#E5A93C;border:1px solid rgba(229,169,60,.3)}
.status-confirmed{background:rgba(48,209,88,.12);color:#30D158;border:1px solid rgba(48,209,88,.3)}
.error-banner{background:rgba(255,69,58,.12);border:1px solid rgba(255,69,58,.3);color:#FF6961;font-size:12px;padding:10px 12px;border-radius:10px;margin-bottom:12px;text-align:center}
/* ── Составы команд: карточка на команду со своим акцентным цветом ── */
.teams-grid{display:flex;flex-direction:column;gap:10px}
.team-card{position:relative;background:#1D2027;border-radius:14px;padding:12px 12px 4px;overflow:hidden;border:1px solid rgba(255,255,255,.05)}
.team-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--team-accent)}
.team-card-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.team-badge{width:26px;height:26px;flex-shrink:0;border-radius:8px;background:var(--team-soft);color:var(--team-accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800}
.team-card-title{flex:1;min-width:0;font-size:13.5px;font-weight:800;color:#F5F6F7;letter-spacing:-.2px}
.team-count{flex-shrink:0;min-width:26px;height:22px;padding:0 8px;border-radius:11px;background:rgba(255,255,255,.06);color:#9BA1AC;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.team-players{display:flex;flex-direction:column}
.team-player{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid rgba(255,255,255,.04);cursor:pointer;transition:opacity .12s}
.team-player:first-child{border-top:none}
.team-player:active{opacity:.6}
.team-player.guest{cursor:default}
.tp-avatar{width:30px;height:30px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.team-player.guest .tp-avatar{background:rgba(255,255,255,.05)!important;color:#6B7280!important}
.tp-body{flex:1;min-width:0}
.tp-name{font-size:13px;font-weight:600;color:#F5F6F7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
.team-player.guest .tp-name{color:#9BA1AC;font-weight:500}
.tp-nick{display:block;font-size:10.5px;color:#6B7280;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp-ovr{flex-shrink:0;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.tp-ovr-empty{color:#3A3E46}
.team-foot{display:flex;align-items:center;justify-content:space-between;margin-top:2px;padding:9px 0 10px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:#6B7280;font-weight:600}
.team-foot b{color:var(--team-accent);font-size:13px;font-variant-numeric:tabular-nums}
.teams-empty{text-align:center;padding:22px 12px}
.teams-empty-icon{font-size:26px;opacity:.4;margin-bottom:6px}
.teams-empty-text{font-size:13px;font-weight:700;color:#9BA1AC}
.teams-empty-hint{font-size:11.5px;color:#565A61;margin-top:3px}
.teams-title{font-size:11px;color:#6B7280;text-transform:uppercase;letter-spacing:.5px;margin:8px 0 4px}
.text-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;box-sizing:border-box;padding:14px;border-radius:999px;font-weight:700;font-size:15px;text-align:center;cursor:pointer;text-decoration:none;transition:transform .15s,background .15s}
.text-btn:active{transform:scale(.97)}
.text-btn-primary{border:none;background:linear-gradient(135deg,#FF3D8A,#D6217E);color:#fff;box-shadow:0 6px 18px rgba(255,61,141,.4)}
.text-btn-primary:active{background:#D6217E}
.text-btn-secondary{border:1px solid rgba(255,61,141,.4);background:rgba(255,61,141,.12);color:#FF8FC4}
.text-btn-danger{border:1px solid rgba(255,69,58,.35);background:rgba(255,69,58,.08);color:#FF6961}
.secondary-row{display:flex;gap:8px;margin-top:8px}
.secondary-btn{flex:1;height:36px;display:flex;align-items:center;justify-content:center;gap:4px;padding:0 8px;border:1px solid rgba(255,255,255,.08);background:#1D2027;color:#D7D9DC;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
/* Игра заполнена — вместо кнопок записи показываем понятную заглушку */
.capacity-full-note{display:flex;align-items:center;gap:11px;margin-top:8px;padding:12px 13px;border-radius:12px;background:rgba(236,106,94,.08);border:1px solid rgba(236,106,94,.22)}
.cfn-icon{font-size:19px;flex-shrink:0;line-height:1}
.cfn-body{flex:1;min-width:0}
.cfn-title{font-size:13.5px;font-weight:800;color:#EC6A5E;letter-spacing:-.2px}
.cfn-sub{font-size:11.5px;color:#9BA1AC;margin-top:2px;font-variant-numeric:tabular-nums}
.sheet-subtitle{font-size:12.5px;color:#9BA1AC;text-align:center;margin:-8px 0 14px}

/* ── статус регистрации: 4 понятных состояния (Доступно / Забронировано,
   ждёт оплаты / Подтверждено / Матч завершён) — заголовок + статус +
   главное действие, чтобы всегда было понятно, что делать дальше ── */
.reg-card{background:#1D2027;border-radius:14px;margin-top:10px;padding:14px}
.reg-card.confirmed{background:linear-gradient(135deg,rgba(48,209,88,.08),#1D2027)}
.reg-card.completed{background:#1D2027}
.reg-headline{font-size:14.5px;font-weight:800;color:#F5F6F7;display:flex;align-items:center;gap:7px;margin-bottom:6px}
.reg-status-line{font-size:12.5px;color:#9BA1AC;margin-bottom:12px}
.reg-status-line b{color:#E5A93C;font-weight:700}
.reg-status-line b.confirmed{color:#30D158}
.reg-actions{display:flex;flex-direction:column;gap:8px}
.reg-extra-row{margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.06);font-size:12px;color:#9BA1AC}
.reg-extra-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.reg-extra-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

<script>
let userId = new URLSearchParams(location.search).get("uid");

function goBackToMenu() {
  location.href = "/app" + (userId ? ("?uid=" + userId) : "");
}

function bnGo(tab) {
  if (tab === "games") return; // уже здесь
  if (tab === "home") { goBackToMenu(); return; }
  if (tab === "profile") {
    location.href = "/app?tab=profile" + (userId ? ("&uid=" + userId) : "");
  }
}

if (window.Telegram && Telegram.WebApp) {
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
  // Отключаем свайп-вниз для закрытия/сворачивания приложения — он часто
  // срабатывает случайно при обычном скролле контента. Скролл и
  // pull-to-refresh внутри приложения при этом продолжают работать как
  // обычно; закрыть можно только кнопкой «Закрыть» в шапке Telegram.
  if (typeof Telegram.WebApp.disableVerticalSwipes === "function") {
    Telegram.WebApp.disableVerticalSwipes();
  }
  if (!userId) {
    const tgUser = Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user;
    if (tgUser && tgUser.id) userId = String(tgUser.id);
  }
  Telegram.WebApp.BackButton.show();
  Telegram.WebApp.BackButton.onClick(goBackToMenu);
}

// Свайп вправо от левого края экрана — тоже работает как "назад"
(function () {
  let startX = null, startY = null;
  document.addEventListener("touchstart", e => {
    const t = e.touches[0];
    if (t.clientX < 24) { startX = t.clientX; startY = t.clientY; }
  }, { passive: true });
  document.addEventListener("touchend", e => {
    if (startX === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - startX;
    const dy = Math.abs(t.clientY - startY);
    if (dx > 70 && dy < 60) goBackToMenu();
    startX = null;
  }, { passive: true });
})();

function showError(msg) {
  document.getElementById("error-banner").innerHTML = `<div class="error-banner">⚠️ ${msg}</div>`;
}

// Дата игры форматируется под язык пользователя (Telegram language_code,
// иначе язык браузера) и везде включает день недели — не только число,
// чтобы сразу было понятно, на какой день приходится игра.
function localeCode() {
  const tw = window.Telegram && Telegram.WebApp;
  const tgLang = tw && tw.initDataUnsafe && tw.initDataUnsafe.user && tw.initDataUnsafe.user.language_code;
  return tgLang || navigator.language || "ru";
}

function capitalize(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

function parseGameDate(g) {
  // ожидаем ISO "YYYY-MM-DD"; для старых игр с другим форматом — null (не участвуют в фильтрах)
  if (!g.date || !/^\d{4}-\d{2}-\d{2}$/.test(g.date)) return null;
  const [y, m, d] = g.date.split("-").map(Number);
  return new Date(y, m - 1, d);
}

function formatDate(g) {
  const dt = parseGameDate(g);
  if (!dt) return g.date || "";
  const loc = localeCode();
  const today = new Date(); today.setHours(0,0,0,0);
  const diffDays = Math.round((dt - today) / 86400000);
  const dayMonth = new Intl.DateTimeFormat(loc, { day: "numeric", month: "long" }).format(dt).replace(/\.$/, "");
  if (diffDays === 0) return `Сегодня, ${dayMonth}`;
  if (diffDays === 1) return `Завтра, ${dayMonth}`;
  const weekday = capitalize(new Intl.DateTimeFormat(loc, { weekday: "long" }).format(dt));
  return `${weekday}, ${dayMonth}`;
}

function shortDate(g) {
  const dt = parseGameDate(g);
  if (!dt) return g.date || "дата?";
  const loc = localeCode();
  const weekday = capitalize(new Intl.DateTimeFormat(loc, { weekday: "short" }).format(dt));
  const dayMonth = new Intl.DateTimeFormat(loc, { day: "numeric", month: "short" }).format(dt).replace(/\.$/, "");
  return `${weekday}, ${dayMonth}`;
}


function isUpcoming(g) {
  const dt = parseGameDate(g);
  if (!dt) return true; // старый формат даты — не теряем игру, считаем предстоящей
  const today = new Date(); today.setHours(0, 0, 0, 0);
  return dt >= today;
}

function hasAnySignup(g) {
  return (g.my_signups || []).length > 0;
}

function hasConfirmedSignup(g) {
  return (g.my_signups || []).some(s => s.status === "confirmed");
}

function hasOpenSpots(g) {
  // Вместимость приходит с бэкенда (команды × игроков в команде) — то же
  // число, по которому там проверяется лимит записи.
  const cap = gameCapacity(g);
  if (!cap) return true; // лимит не задан — считаем открытой
  // Считаем ВСЕ записи, а не только подтверждённые: бронь держит место,
  // даже пока админ не подтвердил оплату.
  return totalPeople(g.signups, null) < cap;
}

// Вместимость игры: значение с бэкенда, с запасным расчётом на случай
// старого ответа API без поля capacity.
function gameCapacity(g) {
  if (!g) return null;
  if (typeof g.capacity === "number" && g.capacity > 0) return g.capacity;
  if (g.num_teams && g.players_per_team) {
    const cap = Number(g.num_teams) * Number(g.players_per_team);
    if (cap > 0) return cap;
  }
  return g.num_players || null;
}

// Сколько мест реально свободно. null — лимит не задан (мест всегда хватает).
// Считаем ВСЕ записи, включая неоплаченные: бронь держит место.
function freeSpots(g) {
  const cap = gameCapacity(g);
  if (!cap) return null;
  return Math.max(0, cap - totalPeople((g && g.signups) || [], null));
}

// Каждая категория — просто предикат над игрой. Чтобы добавить новую вкладку,
// достаточно дописать сюда ещё один объект — вся остальная логика подхватит её сама.
//
// «Мои игры» — только после того, как организатор подтвердил оплату
// (status === "confirmed"). До этого момента игра остаётся в «Доступные» —
// НЕ переезжает в отдельную вкладку — но карточка сама показывает статус
// «Место забронировано · Ждёт оплаты» (см. gameRegistrationStatusWidget),
// так игрок видит и свободные игры, и свою бронь в одном месте и сразу
// понимает: заплатить — и она переедет в «Мои игры» автоматически.
const FILTERS = [
  { id: "available", label: "🏟 Доступные",
    match: g => isUpcoming(g) && !hasConfirmedSignup(g) && (hasAnySignup(g) || hasOpenSpots(g)),
    empty: "Свободных игр пока нет ⚽<br>Загляни позже!" },
  { id: "mine", label: "🟢 Мои игры",
    match: g => isUpcoming(g) && hasConfirmedSignup(g),
    empty: "Пока нет подтверждённых игр.<br>Забронируй место во «Доступные» 🏟 — как только организатор подтвердит оплату, игра появится здесь." },
  { id: "history", label: "✅ История",
    match: g => !isUpcoming(g) && hasAnySignup(g),
    empty: "Пока нет сыгранных игр — они появятся здесь после матча." },
];

let currentFilter = "available";

function matchesFilter(g) {
  const f = FILTERS.find(f => f.id === currentFilter) || FILTERS[0];
  return f.match(g);
}

function currentEmptyMessage() {
  const f = FILTERS.find(f => f.id === currentFilter) || FILTERS[0];
  return f.empty;
}

function renderFilters() {
  document.getElementById("filters").innerHTML = FILTERS.map(f => `
    <div class="filter-chip ${currentFilter === f.id ? "active" : ""}" onclick="setFilter('${f.id}')">${f.label}</div>
  `).join("");
}

function setFilter(id) {
  currentFilter = id;
  renderFilters();
  renderGames(window.__lastGames || []);
}

function openPlayer(targetUserId) {
  if (!targetUserId) return;
  const params = new URLSearchParams();
  params.set("uid", targetUserId);
  if (userId) params.set("me", userId);
  location.href = "/player?" + params.toString();
}

function avatarLetter(name) {
  return ((name || "?").trim().charAt(0) || "?").toUpperCase();
}

// Один реальный человек может встречаться в записях несколько раз — основная
// запись + отдельно добавленные им же гости под тем же user_id. Схлопываем
// это в одну карточку на человека (а не на запись), суммируя гостей и считая
// человека подтверждённым, если подтверждена хотя бы одна из его записей.
function dedupeRoster(signups) {
  const byId = new Map();
  (signups || []).forEach(s => {
    if (!s.user_id) return; // без аккаунта — отдельной карточкой не показываем
    if (!byId.has(s.user_id)) {
      byId.set(s.user_id, {
        user_id: s.user_id, name: s.name, guests: 0, confirmed: false,
        ovr: s.ovr, games_played: s.games_played, goals: s.goals,
      });
    }
    const entry = byId.get(s.user_id);
    entry.guests += (s.guests_count || 0);
    if (s.status === "confirmed") entry.confirmed = true;
  });
  return Array.from(byId.values());
}

function playerCardHtml(p) {
  const statusCls = p.confirmed ? "confirmed" : "pending";
  const guestsBadge = p.guests > 0 ? `<span class="player-card-guests">+${p.guests}</span>` : "";
  const ovr = (typeof p.ovr === "number") ? p.ovr : null;
  return `
    <div class="player-card" onclick="openPlayer('${p.user_id}')">
      <div class="player-card-avatar-wrap">
        <div class="player-card-avatar ${statusCls}">${avatarLetter(p.name)}</div>
        <i class="player-card-dot ${statusCls}"></i>
      </div>
      <div class="player-card-name">${p.name}${guestsBadge}</div>
      ${ovr !== null ? `<div class="player-card-ovr">OVR ${ovr}</div>` : `<div class="player-card-ovr player-card-ovr-empty">OVR —</div>`}
      <div class="player-card-stats">
        <span title="Игр сыграно">🎮 ${p.games_played ?? 0}</span>
        <span title="Голов">⚽ ${p.goals ?? 0}</span>
      </div>
    </div>`;
}

let rosterExpanded = {};

function toggleRosterExpanded(gameId) {
  rosterExpanded[gameId] = !rosterExpanded[gameId];
  renderGames(window.__lastGames || []);
}

// Показываем первых 6 компактными карточками (аватар, ник, OVR, игры,
// голы) — этого достаточно, чтобы окинуть состав взглядом. Остальные
// открываются по тапу на "+N ещё игроков", не уходя с экрана игры.
function rosterHtml(gameId, signups) {
  const players = dedupeRoster(signups);
  if (players.length === 0) {
    return `<div class="roster-empty">Пока никто не записался</div>`;
  }

  const expanded = !!rosterExpanded[gameId];
  const shown = expanded ? players : players.slice(0, 6);
  const extra = players.length - shown.length;

  const grid = `<div class="roster-grid">${shown.map(playerCardHtml).join("")}</div>`;
  let moreBtn = "";
  if (extra > 0) {
    moreBtn = `<button class="roster-more-btn" onclick="toggleRosterExpanded(${gameId})">+${extra} ещё игроков</button>`;
  } else if (expanded && players.length > 6) {
    moreBtn = `<button class="roster-more-btn" onclick="toggleRosterExpanded(${gameId})">Свернуть ▲</button>`;
  }
  return grid + moreBtn;
}

function entryPeopleCount(s) {
  return s.is_addition ? (s.guests_count || 1) : 1 + (s.guests_count || 0);
}

// ── карточка игры: переиспользуемые виджеты ──────────────────────────────────

function mapsUrl(g) {
  const query = g.location + (g.extra_info ? `, ${g.extra_info}` : "");
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}

  return `<div class="gc-title">${ICON_BALL}Футбольный матч</div>`;

// 2. Фото поля — если админ его загрузил, показываем баннером на всю
// ширину карточки сразу под заголовком (ощущение бронирования события —
// сначала картинка места, а не мелкая иконка сбоку). Если фото нет, просто
// не резервируем под него место — лишний пустой блок только добавил бы
// прокрутки без всякой пользы.
function gamePhotoBannerWidget(g) {
  if (!g.image) return "";
  return `<div class="gc-photo-banner"><img src="data:image/jpeg;base64,${g.image}" alt="${g.location}"></div>`;
}

// 3. Поле/адрес — подпись места проведения, компактной строкой, с быстрой
// ссылкой на карту рядом.
function gameFieldWidget(g) {
  const addr = g.extra_info ? ` <span class="gc-field-addr">· ${g.extra_info}</span>` : "";
  return `
    <div class="gc-field-row">
      <div class="gc-field">${ICON_PIN}${g.location}${addr}</div>
      <a class="gc-location-btn" href="${mapsUrl(g)}" target="_blank" onclick="event.stopPropagation()">Открыть</a>

// 4-5. Дата (+день недели) и время.
function gameDateTimeWidget(g) {
  return `
    <div class="gc-datetime-row">
      <span class="gc-date-chip">${shortDate(g)}</span>
      <span class="gc-time-chip">${ICON_CLOCK}${g.time}</span>
    </div>`;
}

// 6. Цена.
function gamePriceWidget(g) {
  if (!g.price) return "";
  return `<div class="gc-price-chip">${ICON_COIN}${g.price}</div>`;
}

// Русское склонение "место/места/мест" по числу (1 место, 2-4 места, 5+ мест).
function pluralSpots(n) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return "место";
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return "места";
  return "мест";
}

// 7 (часть 1). Прогресс записи — визуальный индикатор заполненности:
// сегментированная полоса (10 делений, как в примере из ТЗ —
// "████████░░"), счёт "16 / 20 игроков" и сообщение "Осталось всего N мест".
// Когда свободных мест ≤5 — полоса и сообщение подсвечиваются тревожным
// цветом, создавая ощущение срочности.
function gameCapacityWidget(g) {
  const max = gameCapacity(g);
  // Занятость считаем по ВСЕМ записям (включая неоплаченные) — место
  // занимается в момент брони, как и в проверке лимита на бэкенде.
  const takenCount = totalPeople(g.signups, null);

  if (!max) {
    // Лимит не задан — просто показываем, сколько человек уже записалось,
    // без полосы/сообщения о местах (их в принципе не может не хватить).
    return `<div class="gc-capacity-meta"><span class="gc-capacity-count">${ICON_PEOPLE}${takenCount} игроков записано</span></div>`;
  }

  const freeSpots = Math.max(0, max - takenCount);
  const urgent = freeSpots > 0 && freeSpots <= 5;
  const full = freeSpots === 0;

  const totalSegments = 10;
  const filledSegments = Math.round(Math.min(1, takenCount / max) * totalSegments);
  const segmentsHtml = Array.from({ length: totalSegments }, (_, i) =>
    `<div class="gc-capacity-seg${i < filledSegments ? ` filled${urgent ? " urgent" : ""}` : ""}"></div>`
  ).join("");

  let spotsText;
  if (full) spotsText = "Мест нет";
  else if (freeSpots === 1) spotsText = "Остался всего 1 спот!";
  else if (urgent) spotsText = `Осталось всего ${freeSpots} ${pluralSpots(freeSpots)}!`;
  else spotsText = `${freeSpots} своб. мест`;
  const spotsCls = full ? "full" : urgent ? "urgent" : "";

  return `
    <div class="gc-capacity">
      <div class="gc-capacity-bar">${segmentsHtml}</div>
      <div class="gc-capacity-meta">
        <span class="gc-capacity-count">${ICON_PEOPLE}${takenCount} / ${max} игроков</span>
        <span class="gc-capacity-spots ${spotsCls}">${spotsText}</span>
      </div>
    </div>`;
}

function gameRosterWidget(g, totalCount) {
  // Подзаголовок со сводкой: сколько подтверждено, сколько ещё ждёт оплаты —
  // видно с одного взгляда, не открывая карточки игроков.
  const confirmed = totalPeople(g.signups, "confirmed");
  const pending = Math.max(0, totalCount - confirmed);
  const meta = totalCount > 0
    ? `<div class="roster-legend">
         <span class="rl-item"><i class="rl-dot confirmed"></i>${confirmed} подтв.</span>
         ${pending > 0 ? `<span class="rl-item"><i class="rl-dot pending"></i>${pending} ждёт оплаты</span>` : ""}
       </div>`
    : "";
  return `
    <div class="roster">
      <div class="roster-head">
        <div class="roster-title">${ICON_PEOPLE}Участники <span class="roster-count">${totalCount}</span></div>
        ${meta}
      </div>
      ${rosterHtml(g.id, g.signups)}
    </div>`;
}

function gameAddFormWidget(g, mySignups) {
  // Матч уже прошёл — раздел записи тут не нужен, карточка уже показывает
  // состояние «Матч завершён» (см. gameRegistrationStatusWidget → completedStateHtml).
  if (!isUpcoming(g)) return "";

  // Уже записан — партия регистрации одна на игрока за игру: себя и
  // друзей можно взять только при самой записи, дорегистрировать позже
  // нельзя (см. route_post_games_signup, routes/games.py). Дальше карточка
  // сама показывает статус записи (gameRegistrationStatusWidget).
  if (mySignups.length > 0) return "";

  // Мест не осталось — не даём записаться. Раньше кнопка оставалась
  // активной, шит открывался и предлагал оплатить место, которого нет;
  // бэкенд отклонял запись уже после оплаты.
  const free = freeSpots(g);
  if (free === 0) {
    return `<div class="capacity-full-note">
      <span class="cfn-icon">🚫</span>
      <div class="cfn-body">
        <div class="cfn-title">Набран максимум игроков</div>
        <div class="cfn-sub">${gameCapacity(g)} из ${gameCapacity(g)} мест занято — запись закрыта</div>
      </div>
    </div>`;
  }

  return `<button class="btn" onclick="openSignupSheet(${g.id})">${ICON_BALL}Записаться</button>`;
}

function gameSecondaryWidget(g, mySignups) {
  if (!mySignups.length) return "";
  return `
    <div class="secondary-row">
      <button class="secondary-btn" onclick="toggleTeamsDisplay(${g.id})">${ICON_TROPHY}Команды</button>
      <button class="secondary-btn" onclick="toggleChat(${g.id})" id="chat-toggle-${g.id}">${ICON_CHAT}Чат</button>
    </div>
    <div class="teams-body ${teamsExpanded[g.id] ? "" : "hidden"}" id="teams-body-wrap-${g.id}">${teamsExpanded[g.id] ? teamsInnerHtml(g.teams) : ""}</div>
    <div class="chat-box hidden" id="chat-box-${g.id}">
      <div class="chat-messages" id="chat-messages-${g.id}"></div>
      <div class="chat-input-row">
        <input class="chat-input" id="chat-input-${g.id}" placeholder="Написать..." maxlength="500">
        <button class="chat-send-btn" onclick="sendChatMessage(${g.id})">${ICON_SEND}</button>
      </div>
    </div>`;
}

// Порядок сборки карточки — это и есть иерархия важности информации:
// заголовок → фото поля → поле/адрес → дата+день недели → время → цена →
// прогресс записи → кнопка действия → участники. Экран должен читаться как
// бронирование события сверху вниз, а не как разрозненная форма.
function gameCardWidget(g, index) {
  const totalCount = totalPeople(g.signups, null);
  const mySignups = g.my_signups || [];
  const delay = Math.min(index || 0, 8) * 0.045;

  return `
    <div class="game-card" style="animation-delay:${delay}s">
      ${gameTitleWidget(g)}
      ${gamePhotoBannerWidget(g)}
      ${gameFieldWidget(g)}
      ${gameDateTimeWidget(g)}
      ${gamePriceWidget(g)}
      ${gameCapacityWidget(g)}
      ${gameRegistrationStatusWidget(g)}
      ${gameAddFormWidget(g, mySignups)}
      ${gameRosterWidget(g, totalCount)}
      ${gameSecondaryWidget(g, mySignups)}
    </div>`;
}

let teamsExpanded = {};

function toggleTeamsDisplay(gameId) {
  teamsExpanded[gameId] = !teamsExpanded[gameId];
  renderGames(window.__lastGames || []);
}

function totalPeople(signups, statusFilter) {
  return (signups || [])
    .filter(s => !statusFilter || s.status === statusFilter)
    .reduce((sum, s) => sum + entryPeopleCount(s), 0);
}

// ── Статус регистрации: 4 понятных состояния ────────────────────────────────
// 1. Доступно        → форма записи с кнопкой «Забронировать место» (см.
//                       gameAddFormWidget) — этот виджет тут ничего не рисует.
// 2. Забронировано,
//    ждёт оплаты      → «Место забронировано» + статус + кнопка «Оплатить».
// 3. Подтверждено     → «Ты подтверждён на эту игру».
// 4. Матч завершён     → «Матч завершён» + статистика игрока в этом матче,
//                       если она есть (голы/MVP, my_match_stats из /api/games).
// Игрок всегда видит один и тот же паттерн: заголовок → статус → главное
// действие — и всегда понимает, что делать дальше.

function extraEntryRow(g, s) {
  const count = entryPeopleCount(s);
  const amount = entryAmount(g, s);
  const amountLabel = amount !== null ? ` · ${formatTenge(amount)}` : "";
  const label = s.status === "confirmed" ? "🟢 Подтверждено"
    : s.payment_claimed ? "🟡 Ждём подтверждения" : "🟡 Ждёт оплаты";
  const warnNoRefund = s.status === "confirmed" || s.payment_claimed;

  // Доп. игроки проходят тот же путь оплаты, что и основная запись:
  // «Оплатить» → «Я оплатил(а)» → админ подтверждает → попадают в состав.
  // Кнопки показываем, пока оплата не заявлена и не подтверждена.
  let actionsHtml = "";
  if (s.status !== "confirmed" && !s.payment_claimed) {
    const payLabel = amount !== null ? `${ICON_CARD}Оплатить ${formatTenge(amount)}` : `${ICON_CARD}Оплатить`;
    const payBtn = g.payment_link
      ? `<a class="text-btn text-btn-primary" href="${g.payment_link}" target="_blank">${payLabel}</a>`
      : `<button class="text-btn text-btn-primary" onclick="claimPayment(${g.id}, ${s.id})">${payLabel}</button>`;
    const confirmBtn = g.payment_link
      ? `<button class="text-btn text-btn-secondary" onclick="claimPayment(${g.id}, ${s.id})">${ICON_CHECK}Я оплатил(а)</button>`
      : "";
    actionsHtml = `<div class="reg-extra-actions">${payBtn}${confirmBtn}</div>`;
  }

  return `
    <div class="reg-extra-row">
      <div class="reg-extra-head">
        <span>+ Доп. игроки · ${count} чел.${amountLabel} — ${label}</span>
        <button class="reg-extra-cancel-btn" onclick="cancelEntry(${g.id}, ${s.id}, ${warnNoRefund})">${ICON_X}Отменить</button>
      </div>
      ${actionsHtml}
    </div>`;
}

function reservedStateHtml(g, mySignups) {
  const main = mySignups[0];
  const extra = mySignups.slice(1);
  const claimed = main.payment_claimed;
  const count = entryPeopleCount(main);
  const amount = entryAmount(g, main);
  const payLabel = amount !== null ? `💳 Оплатить ${formatTenge(amount)}` : "💳 Оплатить";
  const amountLine = amount !== null ? ` · К оплате: <b>${formatTenge(amount)}</b>` : "";

  let actionsHtml;
  if (claimed) {
    // Уже нажал «Я оплатил(а)» — платить больше нечего, ждём организатора.
    actionsHtml = `<button class="text-btn text-btn-danger" onclick="cancelEntry(${g.id}, ${main.id}, true)">${ICON_X}Отменить бронь</button>`;
  } else {
    const payBtn = g.payment_link
      ? `<a class="text-btn text-btn-primary" href="${g.payment_link}" target="_blank">${payLabel}</a>`
      : `<button class="text-btn text-btn-primary" onclick="claimPayment(${g.id}, ${main.id})">${payLabel}</button>`;
    const confirmBtn = g.payment_link
      ? `<button class="text-btn text-btn-secondary" onclick="claimPayment(${g.id}, ${main.id})">${ICON_CHECK}Я оплатил(а)</button>`
      : "";
    actionsHtml = `
      ${payBtn}
      ${confirmBtn}
      <button class="text-btn text-btn-danger" onclick="cancelEntry(${g.id}, ${main.id}, false)">${ICON_X}Отменить бронь</button>`;
  }

  return `
    <div class="reg-card">
      <div class="reg-headline">📌 Место забронировано</div>
      <div class="reg-status-line">Статус: <b>${claimed ? "Ждём подтверждения" : "Ждёт оплаты"}</b>${count > 1 ? ` · ${count} чел.` : ""}${amountLine}</div>
      <div class="reg-actions">${actionsHtml}</div>
      ${extra.map(s => extraEntryRow(g, s)).join("")}
    </div>`;
}

function confirmedStateHtml(g, mySignups) {
  const confirmedEntries = mySignups.filter(s => s.status === "confirmed");
  const main = confirmedEntries[0] || mySignups[0];
  const extra = mySignups.filter(s => s.id !== main.id);
  const count = entryPeopleCount(main);
  const amount = entryAmount(g, main);
  const amountLine = amount !== null ? ` · Оплачено: <b class="confirmed">${formatTenge(amount)}</b>` : "";

  return `
    <div class="reg-card confirmed">
      <div class="reg-headline">${ICON_CHECK}Ты подтверждён на эту игру</div>
      <div class="reg-status-line">Статус: <b class="confirmed">Подтверждено</b>${count > 1 ? ` · ${count} чел.` : ""}${amountLine}</div>
      <div class="reg-actions">
        <button class="text-btn text-btn-danger" onclick="cancelEntry(${g.id}, ${main.id}, true)">${ICON_X}Отменить регистрацию</button>
      </div>
      ${extra.map(s => extraEntryRow(g, s)).join("")}
    </div>`;
}

function completedStateHtml(g) {
  const stats = g.my_match_stats;
  // «Показывать статистику, когда она есть» — если по этому матчу ещё не
  // заводили голы/MVP (например, игру завершили старым способом без формы
  // статистики), просто не показываем блок с цифрами, а не выдумываем нули.
  const statsHtml = stats ? `
    <div class="reg-stats-row">
      <div class="reg-stat-badge">
        <div class="reg-stat-badge-value">⚽ ${stats.goals}</div>
        <div class="reg-stat-badge-label">Голы</div>
      </div>
      <div class="reg-stat-badge">
        <div class="reg-stat-badge-value">${stats.is_mvp ? "👑" : "—"}</div>
        <div class="reg-stat-badge-label">MVP</div>
      </div>
    </div>` : "";

  return `
    <div class="reg-card completed">
      <div class="reg-headline">🏁 Матч завершён</div>
      ${statsHtml}
      <a class="reg-report-link" href="/match-report?game_id=${g.id}${userId ? `&uid=${userId}` : ""}">📊 Отчёт о матче →</a>
    </div>`;
}

function gameRegistrationStatusWidget(g) {
  const mySignups = g.my_signups || [];
  if (!isUpcoming(g)) {
    // Матч уже прошёл — неважно, в каком статусе была запись, теперь это
    // просто «Матч завершён» (+ статистика, если она есть).
    return mySignups.length ? completedStateHtml(g) : "";
  }
  if (mySignups.length === 0) return ""; // состояние «Доступно» — см. gameAddFormWidget
  if (mySignups.some(s => s.status === "confirmed")) return confirmedStateHtml(g, mySignups);
  return reservedStateHtml(g, mySignups);
}

function renderGames(games) {
  window.__lastGames = games || [];
  const el = document.getElementById("games-list");
  const filtered = (games || []).filter(matchesFilter);

  if (filtered.length === 0) {
    el.innerHTML = `<div class="empty">${currentEmptyMessage()}</div>`;
    return;
  }

  el.innerHTML = filtered.map((g, i) => gameCardWidget(g, i)).join("");
}

// Составы команд: каждая команда — карточка со своим цветом (полоса слева,
// цветной бейдж-номер), списком игроков с аватарами и OVR, и сводкой снизу
// (число игроков + средний OVR), чтобы на глаз оценить баланс команд.
const TEAM_THEMES = [
  { name: "Команда 1", accent: "#FF3D8A", soft: "rgba(255,61,141,.16)", label: "A" },
  { name: "Команда 2", accent: "#30D158", soft: "rgba(48,209,88,.16)",  label: "B" },
  { name: "Команда 3", accent: "#E5A93C", soft: "rgba(229,169,60,.16)", label: "C" },
  { name: "Команда 4", accent: "#EC6A5E", soft: "rgba(236,106,94,.16)", label: "D" },
];

function teamTheme(i) {
  return TEAM_THEMES[i % TEAM_THEMES.length];
}

function teamPlayerRowHtml(p, theme) {
  const isGuest = !p.user_id;
  const ovr = (typeof p.ovr === "number") ? p.ovr : null;
  const clickable = isGuest ? "" : ` onclick="openPlayer('${p.user_id}')"`;
  const nick = p.player ? `<span class="tp-nick">${p.player}</span>` : "";
  return `
    <div class="team-player${isGuest ? " guest" : ""}"${clickable}>
      <div class="tp-avatar" style="background:${theme.soft};color:${theme.accent}">${avatarLetter(p.name)}</div>
      <div class="tp-body">
        <div class="tp-name">${p.name}</div>
        ${nick}
      </div>
      ${ovr !== null ? `<div class="tp-ovr" style="color:${theme.accent}">${ovr}</div>` : `<div class="tp-ovr tp-ovr-empty">—</div>`}
    </div>`;
}

function teamsInnerHtml(teams) {
  if (!teams || teams.length === 0) {
    return `<div class="teams-empty">
      <div class="teams-empty-icon">🏆</div>
      <div class="teams-empty-text">Составы пока не сформированы</div>
      <div class="teams-empty-hint">Появятся, когда организатор подтвердит оплаты</div>
    </div>`;
  }

  const byTeam = {};
  teams.forEach(m => (byTeam[m.team_index] = byTeam[m.team_index] || []).push(m));
  const indices = Object.keys(byTeam).map(Number).sort((a, b) => a - b);

  return `<div class="teams-grid">` + indices.map(i => {
    const theme = teamTheme(i);
    const members = byTeam[i];
    // Средний OVR — только по игрокам с аккаунтом: у гостей статистики нет,
    // и включать их как нули исказило бы силу команды.
    const rated = members.filter(m => typeof m.ovr === "number");
    const avg = rated.length
      ? Math.round(rated.reduce((sum, m) => sum + m.ovr, 0) / rated.length)
      : null;

    return `
      <div class="team-card" style="--team-accent:${theme.accent};--team-soft:${theme.soft}">
        <div class="team-card-head">
          <div class="team-badge">${theme.label}</div>
          <div class="team-card-title">${theme.name}</div>
          <div class="team-count">${members.length}</div>
        </div>
        <div class="team-players">
          ${members.map(p => teamPlayerRowHtml(p, theme)).join("")}
        </div>
        ${avg !== null ? `<div class="team-foot"><span>Средний OVR</span><b>${avg}</b></div>` : ""}
      </div>`;
  }).join("") + `</div>`;
}

let lastGamesHash = "";

async function loadGames() {
  try {
    const r = await fetch(`/api/games?user_id=${userId || ""}`).then(r => r.json());
    const hash = JSON.stringify(r.games);
    if (hash === lastGamesHash) return; // ничего не изменилось — не дёргаем DOM зря
    lastGamesHash = hash;
    renderGames(r.games);
  } catch (e) {
    showError("Не удалось загрузить игры. Попробуй ещё раз.");
    // Скелетон ещё не сменился реальным списком (window.__lastGames не
    // выставлен renderGames()) — без этого он бы «грузился» бесконечно,
    // хотя запрос уже провалился. На повторных опросах, когда список уже
    // показан, оставляем его как есть — баннер сверху уже сообщил об ошибке.
    if (!window.__lastGames) {
      document.getElementById("games-list").innerHTML =
        `<div class="empty">⚠️ Не удалось загрузить игры<br><span style="font-size:12px">Проверь соединение — пробуем снова каждые несколько секунд</span></div>`;
    }
  }
}

// ── Единая отправка регистрации: и «сам», и «компания» идут сюда, разница
//    только в guests_count. Старый inline-флоу с полем количества заменён
//    Bottom Sheet'ом (см. openSignupSheet ниже) — API и бэкенд не менялись. ──
async function submitSignup(gameId, guestsCount) {
  if (!userId) {
    showError("Не удалось определить тебя. Открой игры заново через бота.");
    return null;
  }
  try {
    const res = await fetch("/api/games/signup", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId, game_id: gameId, guests_count: guestsCount })
    }).then(r => r.json());
    if (!res.ok) {
      showError(res.error || "Не удалось записаться.");
      return null;
    }
    document.getElementById("error-banner").innerHTML = "";
    loadGames();
    return res;  // {ok, amount, signup_id, invites}
  } catch (e) {
    showError("Ошибка сети — попробуй ещё раз.");
    return null;
  }
}

// ── Bottom Sheet записи ──────────────────────────────────────────────────────
let sheetGameId = null;      // игра, для которой открыт шит (null = закрыт)
let sheetGame = null;        // объект игры — цена и payment_link берутся отсюда
let sheetCompanyCount = 2;   // сколько всего людей в режиме «компания»
let sheetSubmitting = false; // защита от двойного тапа во время запроса

const SHEET_MIN_PEOPLE = 1;  // «Оплатить 2500 ₸» за одного тоже валидный случай
const SHEET_MAX_PEOPLE = 20; // тот же потолок, что и у бэкенда (guests_count ≤ 20)

// Сколько ещё людей реально можно записать на игру: свободные места,
// но не больше потолка партии. Степперы не дают выбрать больше, чем
// влезет. 0 — мест нет вовсе (шит в этом случае не открывается).
function sheetMaxPeople(g) {
  const free = freeSpots(g);
  if (free === null) return SHEET_MAX_PEOPLE;
  return Math.min(SHEET_MAX_PEOPLE, free);
}

// Цена за игрока приходит ГОТОВЫМ числом с бэкенда (game.price_per_player,
// см. routes/games.py + storage/pricing.py) — фронтенд текст цены не парсит
// и никаких сумм не хардкодит. null — у игры нет распознаваемой цены.
function pricePerPlayer(g) {
  const n = g && g.price_per_player;
  return (typeof n === "number" && n > 0) ? n : null;
}

// Сумма конкретной партии записи: приоритет — amount, зафиксированный
// бэкендом в момент записи; для старых записей без amount — пересчёт из
// той же цены игры. null — сумма неизвестна (цены у игры нет).
function entryAmount(g, s) {
  if (s && typeof s.amount === "number" && s.amount > 0) return s.amount;
  const per = pricePerPlayer(g);
  return per === null ? null : per * entryPeopleCount(s);
}

function formatTenge(n) {
  return `${n} ₸`;
}

function haptic(kind) {
  const h = window.Telegram && Telegram.WebApp && Telegram.WebApp.HapticFeedback;
  if (!h) return;
  try {
    if (kind === "success" || kind === "error") h.notificationOccurred(kind);
    else h.impactOccurred(kind || "light");
  } catch (e) {}
}

function openSignupSheet(gameId) {
  const g = (window.__lastGames || []).find(x => x.id === gameId) || null;
  // Данные могли устареть между отрисовкой и тапом (кто-то записался
  // параллельно) — проверяем ещё раз перед открытием шита.
  if (freeSpots(g) === 0) {
    haptic("error");
    showError("Набран максимум игроков — мест больше нет.");
    loadGames();
    return;
  }
  sheetGameId = gameId;
  sheetGame = g;
  sheetShowChoice();
  document.getElementById("sheet-backdrop").classList.add("open");
  document.getElementById("signup-sheet").classList.add("open");
  haptic("light");
}

function closeSignupSheet() {
  sheetGameId = null;
  sheetGame = null;
  const sheet = document.getElementById("signup-sheet");
  sheet.classList.remove("open", "dragging");
  sheet.style.transform = "";
  document.getElementById("sheet-backdrop").classList.remove("open");
}

function sheetShowChoice() {
  document.getElementById("sheet-view-choice").classList.remove("hidden");
  document.getElementById("sheet-view-company").classList.add("hidden");
  document.getElementById("sheet-view-confirmed").classList.add("hidden");
}

async function sheetChooseSolo() {
  if (sheetSubmitting || sheetGameId === null) return;
  sheetSubmitting = true;
  haptic("medium");
  const gameId = sheetGameId;
  closeSignupSheet();
  const res = await submitSignup(gameId, 0);
  haptic(res ? "success" : "error");
  sheetSubmitting = false;
}

function sheetChooseCompany() {
  // Стартуем с 2 человек, но не больше, чем реально свободно
  // (если осталось одно место — покажем 1).
  sheetCompanyCount = Math.min(2, sheetMaxPeople(sheetGame));
  sheetRenderCompany(false);
  document.getElementById("sheet-view-choice").classList.add("hidden");
  document.getElementById("sheet-view-company").classList.remove("hidden");
  haptic("light");
}

function sheetStep(delta) {
  const next = sheetCompanyCount + delta;
  if (next < SHEET_MIN_PEOPLE || next > sheetMaxPeople(sheetGame)) return;
  sheetCompanyCount = next;
  sheetRenderCompany(true);
  haptic("light");
}

// Перерисовка экрана «компания»: счётчик, цена за игрока, итог и сумма на
// кнопке пересчитываются мгновенно при каждом изменении количества.
// animate=true перезапускает пульс на итоговой сумме и кнопке.
function sheetRenderCompany(animate) {
  document.getElementById("sheet-step-value").textContent = sheetCompanyCount;
  document.getElementById("sheet-step-minus").disabled = sheetCompanyCount <= SHEET_MIN_PEOPLE;
  document.getElementById("sheet-step-plus").disabled = sheetCompanyCount >= sheetMaxPeople(sheetGame);

  const per = pricePerPlayer(sheetGame);
  const rows = document.getElementById("sheet-price-rows");
  const totalEl = document.getElementById("sheet-price-total");
  const btn = document.getElementById("sheet-confirm-btn");

  if (per === null) {
    rows.classList.add("hidden");
    btn.textContent = "⚽ Забронировать места";
    return;
  }

  rows.classList.remove("hidden");
  const total = per * sheetCompanyCount;
  document.getElementById("sheet-price-per").textContent = formatTenge(per);
  totalEl.textContent = formatTenge(total);
  btn.textContent = `Оплатить ${formatTenge(total)}`;

  if (animate) {
    for (const el of [totalEl, btn]) {
      el.classList.remove("price-pop");
      void el.offsetWidth; // reflow — чтобы анимация перезапустилась
      el.classList.add("price-pop");
    }
  }
}

async function sheetConfirmCompany() {
  if (sheetSubmitting || sheetGameId === null) return;
  sheetSubmitting = true;
  const btn = document.getElementById("sheet-confirm-btn");
  btn.disabled = true;
  haptic("medium");
  const gameId = sheetGameId;
  const paymentLink = sheetGame && sheetGame.payment_link;
  const peopleCount = sheetCompanyCount;         // сколько игроков оплачено этой компанией
  const guestsCount = sheetCompanyCount - 1;     // регистрант + гости
  const res = await submitSignup(gameId, guestsCount);
  haptic(res ? "success" : "error");
  btn.disabled = false;
  sheetSubmitting = false;
  if (!res) { closeSignupSheet(); return; }

  if (paymentLink) {
    // «Оплатить» честно ведёт к оплате: бронь создана — открываем платёжную
    // ссылку игры. Экран подтверждения показываем сразу за ней.
    const tw = window.Telegram && Telegram.WebApp;
    if (tw && typeof tw.openLink === "function") tw.openLink(paymentLink);
    else window.open(paymentLink, "_blank");
  }

  // Свежий объект игры уже с новой записью — из него берём «ожидаем игроков».
  loadGames();
  sheetShowCompanyConfirmed(gameId, peopleCount, res.invites || [], res.signup_id);
}

// Экран подтверждения регистрации компании: оплачено / ожидаем игроков +
// список приглашений (Player 2 … Player N) с кнопкой «Copy Link» на каждое.
// «Ожидаем» = свободные места игры (лимит − записанные). Если лимита нет — 0.
function sheetShowCompanyConfirmed(gameId, paidCount, invites, signupId) {
  const g = (window.__lastGames || []).find(x => x.id === gameId) || sheetGame;
  let waiting = 0;
  const cap = gameCapacity(g);
  if (cap) {
    const taken = totalPeople(g.signups, null);
    waiting = Math.max(0, cap - taken);
  }
  document.getElementById("sheet-conf-paid").textContent = paidCount;
  document.getElementById("sheet-conf-waiting").textContent = waiting;

  sheetInvites = invites || [];
  sheetInviteSignupId = signupId || null;
  renderInviteList();

  document.getElementById("sheet-view-choice").classList.add("hidden");
  document.getElementById("sheet-view-company").classList.add("hidden");
  document.getElementById("sheet-view-confirmed").classList.remove("hidden");
  // шит уже открыт — просто меняем экран, никакой навигации по страницам
  document.getElementById("sheet-backdrop").classList.add("open");
  document.getElementById("signup-sheet").classList.add("open");
}

let sheetInvites = [];         // приглашения текущей компании (Player 2..N)
let sheetInviteSignupId = null;

// Каждое приглашение — строка «Player N» + «Copy Link». Занятые места
// показываются именем игрока и без кнопки копирования.
function renderInviteList() {
  const box = document.getElementById("sheet-invite-list");
  if (!sheetInvites.length) { box.innerHTML = ""; return; }
  box.innerHTML = sheetInvites.map((inv, i) => {
    const label = inv.claimed
      ? `<span class="sheet-invite-name claimed">✅ ${inv.claimed_name || "Игрок"}</span>`
      : `<span class="sheet-invite-name">Player ${inv.slot_index}</span>`;
    const btn = inv.claimed
      ? `<span class="sheet-invite-copy done">Занято</span>`
      : (inv.link
          ? `<button class="sheet-invite-copy" id="inv-copy-${i}" onclick="copyInviteLink(${i})">🔗 Copy Link</button>`
          : `<span class="sheet-invite-copy done">—</span>`);
    return `<div class="sheet-invite-row">${label}${btn}</div>`;
  }).join("");
}

async function copyInviteLink(i) {
  const inv = sheetInvites[i];
  if (!inv || !inv.link) return;
  const btn = document.getElementById(`inv-copy-${i}`);
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(inv.link);
    } else {
      const ta = document.createElement("textarea");
      ta.value = inv.link; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
    }
    haptic("light");
    if (btn) {
      btn.classList.add("copied");
      btn.textContent = "✅ Скопировано";
      setTimeout(() => { btn.classList.remove("copied"); btn.textContent = "🔗 Copy Link"; }, 1600);
    }
  } catch (e) {
    // копирование недоступно — отдаём ссылку через нативный шэринг Telegram
    const tw = window.Telegram && Telegram.WebApp;
    const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(inv.link)}`;
    if (tw && typeof tw.openTelegramLink === "function") tw.openTelegramLink(shareUrl);
    else window.open(shareUrl, "_blank");
  }
}

function sheetInvitePlayers() {
  haptic("medium");
  const gameId = sheetGameId;
  const g = (window.__lastGames || []).find(x => x.id === gameId) || sheetGame;
  closeSignupSheet();

  // Приглашение через нативный Telegram-шэринг: ссылка на бота (с бэкенда) +
  // короткий текст. Если ссылки нет — шэрим только текст.
  const tw = window.Telegram && Telegram.WebApp;
  const botLink = g && g.share_link;
  const when = g ? `${g.date || ""} ${g.time || ""}`.trim() : "";
  const text = `⚽ Собираю команду на игру${when ? ` ${when}` : ""}! Присоединяйся 👇`;
  const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(botLink || "")}&text=${encodeURIComponent(text)}`;
  if (tw && typeof tw.openTelegramLink === "function") tw.openTelegramLink(shareUrl);
  else window.open(shareUrl, "_blank");
}

// Свайп-вниз по шиту закрывает его — как в нативных Telegram Bottom Sheet.
(function () {
  const sheet = document.getElementById("signup-sheet");
  let startY = null, delta = 0;
  sheet.addEventListener("touchstart", e => {
    if (!sheet.classList.contains("open")) return;
    startY = e.touches[0].clientY;
    delta = 0;
    sheet.classList.add("dragging");
  }, { passive: true });
  sheet.addEventListener("touchmove", e => {
    if (startY === null) return;
    delta = Math.max(0, e.touches[0].clientY - startY);
    sheet.style.transform = `translateY(${delta}px)`;
  }, { passive: true });
  sheet.addEventListener("touchend", () => {
    if (startY === null) return;
    sheet.classList.remove("dragging");
    if (delta > 90) {
      closeSignupSheet();
      haptic("light");
    } else {
      sheet.style.transform = "";
    }
    startY = null;
  }, { passive: true });
})();

async function claimPayment(gameId, entryId) {
  if (!userId) return;
  try {
    const res = await fetch("/api/games/claim-payment", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId, game_id: gameId, entry_id: entryId })
    }).then(r => r.json());
    if (res.ok) {
      document.getElementById("error-banner").innerHTML = "";
      loadGames();
    } else {
      showError(res.error || "Не удалось отметить оплату.");
    }
  } catch (e) {
    showError("Ошибка сети — попробуй ещё раз.");
  }
}

async function cancelEntry(gameId, entryId, warnNoRefund) {
  if (!userId) return;
  if (warnNoRefund) {
    const ok = confirm("Деньги за оплату не возвращаются при отказе. Точно хочешь отказаться?");
    if (!ok) return;
  }
  try {
    const res = await fetch("/api/games/cancel-signup", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId, game_id: gameId, entry_id: entryId })
    }).then(r => r.json());
    if (res.ok) {
      document.getElementById("error-banner").innerHTML = "";
      loadGames();
    } else {
      showError(res.error || "Не удалось отменить запись.");
    }
  } catch (e) {
    showError("Ошибка сети — попробуй ещё раз.");
  }
}

let openChats = {};       // gameId -> true/false
let chatPollTimers = {};  // gameId -> intervalId
let chatMessages = {};    // gameId -> [messages]

function renderChatMessages(gameId) {
  const el = document.getElementById(`chat-messages-${gameId}`);
  if (!el) return;
  const msgs = chatMessages[gameId] || [];
  if (msgs.length === 0) {
    el.innerHTML = `<div class="chat-empty">Пока тишина — напиши первым</div>`;
  } else {
    const wasAtBottom = el.scrollTop + el.clientHeight >= el.scrollHeight - 10;
    el.innerHTML = msgs.map(m => {
      const mine = m.user_id === userId ? " mine" : "";
      return `<div class="chat-msg${mine}"><span class="who">${m.name}:</span>${m.text}</div>`;
    }).join("");
    if (wasAtBottom || msgs.length <= 20) el.scrollTop = el.scrollHeight;
  }
}

async function pollChat(gameId) {
  if (!userId) return;
  try {
    const r = await fetch(`/api/games/chat?user_id=${userId}&game_id=${gameId}&since_id=0`).then(r => r.json());
    if (r.messages) {
      chatMessages[gameId] = r.messages;
      renderChatMessages(gameId);
    }
  } catch (e) {}
}

function toggleChat(gameId) {
  const box = document.getElementById(`chat-box-${gameId}`);
  const btn = document.getElementById(`chat-toggle-${gameId}`);
  if (openChats[gameId]) {
    box.classList.add("hidden");
    openChats[gameId] = false;
    btn.textContent = "💬 Чат";
    clearInterval(chatPollTimers[gameId]);
  } else {
    box.classList.remove("hidden");
    openChats[gameId] = true;
    btn.textContent = "🔼 Скрыть";
    pollChat(gameId);
    // Сбрасываем прежний таймер перед созданием нового — иначе при быстром
    // открытии/закрытии чата таймеры накапливались и опрос шёл в несколько
    // потоков. В фоне (свёрнутое приложение) чат тоже не опрашиваем.
    clearInterval(chatPollTimers[gameId]);
    chatPollTimers[gameId] = setInterval(() => {
      if (!document.hidden) pollChat(gameId);
    }, 3000);
  }
}

async function sendChatMessage(gameId) {
  const input = document.getElementById(`chat-input-${gameId}`);
  const text = input.value.trim();
  if (!text || !userId) return;
  input.value = "";
  try {
    const res = await fetch("/api/games/chat/send", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user_id: userId, game_id: gameId, text })
    }).then(r => r.json());
    if (res.ok) pollChat(gameId);
    else showError(res.error || "Не удалось отправить сообщение.");
  } catch (e) {
    showError("Ошибка сети — попробуй ещё раз.");
  }
}

renderFilters();
loadGames();
// Фоновый опрос списка игр. Оптимизации:
//  • когда приложение свёрнуто/неактивно — не опрашиваем вовсе (главная
//    экономия батареи и трафика: раньше запросы шли даже в фоне);
//  • при возврате на экран обновляемся сразу, не дожидаясь тика;
//  • открытый чат/шит/ввод текста по-прежнему ставят опрос на паузу,
//    чтобы список не перерисовывался под руками.
function gamesPollTick() {
  if (document.hidden) return;
  const anyChatOpen = Object.values(openChats).some(v => v);
  const gamesListEl = document.getElementById("games-list");
  const typingNow = gamesListEl && gamesListEl.contains(document.activeElement)
    && (document.activeElement.tagName === "INPUT");
  const sheetOpen = sheetGameId !== null;
  if (!anyChatOpen && !typingNow && !sheetOpen) loadGames();
}

setInterval(gamesPollTick, 4000);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) gamesPollTick();
});
</script>
